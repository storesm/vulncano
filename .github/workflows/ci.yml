name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        working-directory: backend
        run: pip install -e ".[dev]"
      - name: Test
        working-directory: backend
        run: pytest -q
      - name: Schema files are up to date
        run: |
          python scripts/generate_schema.py
          git diff --exit-code scripts/schema.*.sql

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build
        working-directory: frontend
        run: |
          npm install
          npm run build
